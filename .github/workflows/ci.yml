name: CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_diary_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: "ci-secret-key"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"

      POSTGRES_DB: personal_diary_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"

      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpq-dev \
            zlib1g-dev \
            libjpeg-dev

      - name: Install Poetry 2.x
        run: |
          python -m pip install --upgrade pip
          pip install "poetry==2.0.1"
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-py312-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-py312-poetry-

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Lint (flake8)
        run: |
          poetry run flake8

      - name: Run migrations
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        run: |
          poetry run python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: tests-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --build-arg POETRY_VERSION=2.0.1 -t personal-diary:ci .
